; PigSave, firmware da cinta (ESP-12F / ESP8266)
;
; wifi : cinta controlada pelo aplicativo, com servidor HTTP
; auto : cinta sem Wi-Fi, só com o ciclo de tempo
;
; Compilar e gravar:  pio run -e wifi -t upload

[platformio]
default_envs = wifi

[env]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 9600

[env:wifi]
build_flags = -DPIGSAVE_WIFI
lib_deps = bblanchon/ArduinoJson@^6.18.3

[env:auto]
